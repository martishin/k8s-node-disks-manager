namespace:
  create: true
  name: node-disks-system
  podSecurity:
    enforce: privileged
    audit: privileged
    warn: privileged

controller:
  image:
    repository: node-disks-operator
    tag: dev
    pullPolicy: IfNotPresent
  leaderElection: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

agent:
  image:
    repository: node-disks-agent
    tag: dev
    pullPolicy: IfNotPresent
  scanPeriod: 15s
  bootstrap:
    enabled: true
    disksPerNode: 3
    diskSizeMiB: 64
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  hostPathRoot: /var/lib/node-disks-manager

serviceMonitor:
  enabled: false
