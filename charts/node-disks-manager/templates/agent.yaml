apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-disks-agent
  namespace: {{ include "node-disks-manager.namespace" . }}
  labels:
    app.kubernetes.io/name: node-disks-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-disks-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-disks-agent
    spec:
      serviceAccountName: node-disks-agent
      initContainers:
        - name: init-host-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /host-node-disks-manager/disks
              chown -R 65532:65532 /host-node-disks-manager/disks
              chmod -R ug+rwX /host-node-disks-manager/disks
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: host-node-disks-manager
              mountPath: /host-node-disks-manager
      containers:
        - name: agent
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - --scan-period={{ .Values.agent.scanPeriod }}
            - --disk-dir=/host-node-disks-manager/disks
            - --host-root-path={{ .Values.agent.hostPathRoot }}
            - --mount-root-path=/host-node-disks-manager
            - --metrics-bind-address=:2112
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 2112
              name: metrics
          volumeMounts:
            - name: host-node-disks-manager
              mountPath: /host-node-disks-manager
          resources:
{{ toYaml .Values.agent.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
      volumes:
        - name: host-node-disks-manager
          hostPath:
            path: {{ .Values.agent.hostPathRoot }}
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: node-disks-agent-metrics
  namespace: {{ include "node-disks-manager.namespace" . }}
  labels:
    app.kubernetes.io/name: node-disks-agent
spec:
  selector:
    app.kubernetes.io/name: node-disks-agent
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics
